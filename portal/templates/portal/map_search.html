{% extends 'portal/map.html' %}{% load static %}
{% block head %}
{{ block.super }}
<style>
.websig-address-search{position:absolute;z-index:30;left:12px;top:12px;width:min(430px,calc(100% - 90px));pointer-events:none}.websig-address-search .search-shell{pointer-events:auto;background:#fff;border:1px solid #d9ded9;border-radius:11px;box-shadow:0 5px 18px #0002;overflow:visible}.websig-address-row{display:grid;grid-template-columns:32px 1fr 32px;align-items:center}.websig-address-icon{display:grid;place-items:center;color:#53625b;font-size:18px}.websig-address-input{width:100%;border:0!important;padding:11px 4px!important;font-size:13px;outline:none!important;box-shadow:none!important;background:#fff!important}.websig-address-clear{border:0;background:#fff;color:#7d8580;font-size:19px;cursor:pointer;height:38px}.websig-address-results{display:none;margin-top:5px;max-height:330px;overflow:auto;background:#fff;border:1px solid #d9ded9;border-radius:10px;box-shadow:0 7px 22px #0003}.websig-address-results.open{display:block}.websig-address-item{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:9px;border-bottom:1px solid #eef0ee;cursor:pointer}.websig-address-item:hover{background:#f8faf8}.websig-address-source{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:#f1f4f2}.websig-address-item b{display:block;color:#173d2f;font-size:12px}.websig-address-item small{display:block;color:#6b756f;font-size:10px;margin-top:2px}.websig-address-badge{font-size:9px;font-weight:850;border-radius:999px;padding:4px 7px;background:#eef5f0;color:#056b3c}.websig-address-badge.osm{background:#edf3ff;color:#315a91}.websig-address-status{font-size:11px;color:#68736d;padding:8px 10px}.websig-destination-card{display:none;pointer-events:auto;margin-top:5px;background:#fff;border:1px solid #d9ded9;border-radius:10px;box-shadow:0 7px 22px #0003;padding:9px 10px}.websig-destination-card.open{display:flex;align-items:center;justify-content:space-between;gap:9px}.websig-destination-card strong{display:block;color:#173d2f;font-size:11px}.websig-destination-card small{display:block;color:#6b756f;font-size:9px}.websig-route-btn{white-space:nowrap;text-decoration:none;background:#056b3c;color:#fff;border-radius:8px;padding:7px 9px;font-weight:800;font-size:10px}.websig-search-marker{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#ef3b2d;border:3px solid #fff;box-shadow:0 3px 13px #0005;position:relative}.websig-search-marker:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;left:9px;top:9px}
@media(max-width:1100px){.websig-address-search{left:58px;top:10px;width:min(390px,calc(100% - 185px))}}@media(max-width:600px){.websig-address-search{left:54px;width:calc(100% - 165px)}.websig-address-item{grid-template-columns:28px 1fr}.websig-address-badge{display:none}.websig-destination-card.open{align-items:flex-start;flex-direction:column}.websig-route-btn{width:100%;text-align:center;box-sizing:border-box}}
</style>
{% endblock %}
{% block content %}
{{ block.super }}
<div id="address-search-overlay" class="websig-address-search" aria-label="Recherche d'adresse">
  <div class="search-shell">
    <div class="websig-address-row">
      <span class="websig-address-icon">⌕</span>
      <input id="address-search-input" class="websig-address-input" type="search" autocomplete="off" placeholder="Rechercher une adresse…" aria-label="Rechercher une adresse">
      <button id="address-search-clear" class="websig-address-clear" type="button" aria-label="Effacer">×</button>
    </div>
    <div id="address-search-results" class="websig-address-results"></div>
  </div>
  <div id="address-destination-card" class="websig-destination-card">
    <div><strong id="address-destination-label"></strong><small id="address-destination-source"></small></div>
    <a id="address-route-button" class="websig-route-btn" href="#" target="_blank" rel="noopener">Partir à cette adresse</a>
  </div>
</div>
{% endblock %}
{% block scripts %}
{{ block.super }}
<script src="{% static 'portal/js/address_search_map.js' %}"></script>
{% endblock %}
