{% extends 'portal/map.html' %}{% load static %}
{% block head %}
{{ block.super }}
<style>
.websig-address-search{position:absolute;z-index:30;left:12px;top:12px;width:min(330px,calc(100% - 95px));pointer-events:none}.websig-address-search .search-shell{pointer-events:auto;background:#fff;border:1px solid #d9ded9;border-radius:10px;box-shadow:0 5px 18px #0002;overflow:visible}.websig-address-row{display:grid;grid-template-columns:34px 1fr 30px;align-items:center}.websig-address-toggle{border:0;background:#fff;color:#53625b;font-size:18px;cursor:pointer;height:38px;display:grid;place-items:center;border-radius:9px 0 0 9px}.websig-address-input{width:100%;border:0!important;padding:10px 3px!important;font-size:13px;outline:none!important;box-shadow:none!important;background:#fff!important}.websig-address-clear{border:0;background:#fff;color:#7d8580;font-size:19px;cursor:pointer;height:38px}.websig-address-results{display:none;margin-top:5px;max-height:300px;overflow:auto;background:#fff;border:1px solid #d9ded9;border-radius:10px;box-shadow:0 7px 22px #0003}.websig-address-results.open{display:block}.websig-address-item{display:grid;grid-template-columns:28px 1fr auto;gap:7px;align-items:center;padding:8px;border-bottom:1px solid #eef0ee;cursor:pointer}.websig-address-item:hover{background:#f8faf8}.websig-address-source{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:#f1f4f2}.websig-address-item b{display:block;color:#173d2f;font-size:11px}.websig-address-item small{display:block;color:#6b756f;font-size:9px;margin-top:2px}.websig-address-badge{font-size:8px;font-weight:850;border-radius:999px;padding:4px 6px;background:#eef5f0;color:#056b3c}.websig-address-badge.osm{background:#edf3ff;color:#315a91}.websig-address-status{font-size:11px;color:#68736d;padding:8px 10px}.websig-destination-card{display:none;pointer-events:auto;margin-top:5px;background:#fff;border:1px solid #d9ded9;border-radius:10px;box-shadow:0 7px 22px #0003;padding:8px 9px;gap:8px;align-items:center;justify-content:space-between}.websig-destination-card.open{display:flex}.websig-destination-card strong{display:block;color:#173d2f;font-size:10px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.websig-destination-card small{display:block;color:#6b756f;font-size:9px}.websig-route-btn{width:34px;height:34px;display:grid;place-items:center;flex:0 0 34px;text-decoration:none;background:#056b3c;color:#fff;border-radius:8px;font-weight:900;font-size:17px}.websig-search-marker{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#ef3b2d;border:3px solid #fff;box-shadow:0 3px 13px #0005;position:relative}.websig-search-marker:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;left:8px;top:8px}
@media(max-width:700px){.websig-address-search{left:54px;top:10px;width:min(285px,calc(100% - 120px))}.websig-address-search.mobile-collapsed{width:40px}.websig-address-search.mobile-collapsed .websig-address-row{grid-template-columns:38px}.websig-address-search.mobile-collapsed .websig-address-input,.websig-address-search.mobile-collapsed .websig-address-clear,.websig-address-search.mobile-collapsed .websig-address-results,.websig-address-search.mobile-collapsed .websig-destination-card{display:none!important}.websig-address-item{grid-template-columns:26px 1fr}.websig-address-badge{display:none}.websig-address-results{max-height:42vh}.maplibregl-popup{max-width:calc(100vw - 38px)!important}.maplibregl-popup-content{max-width:calc(100vw - 52px)!important;max-height:44vh;overflow:auto;padding:12px 28px 12px 12px!important;font-size:12px;line-height:1.35}.maplibregl-popup-close-button{font-size:21px;padding:4px 8px}.websig-popup{min-width:0!important;max-width:100%!important}.websig-popup dl{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;margin:8px 0 0}.websig-popup dt,.websig-popup dd{margin:0;font-size:11px}}
</style>
{% endblock %}
{% block content %}
{{ block.super }}
<div id="address-search-overlay" class="websig-address-search" aria-label="Recherche d'adresse">
  <div class="search-shell">
    <div class="websig-address-row">
      <button id="address-search-toggle" class="websig-address-toggle" type="button" aria-label="Ouvrir la recherche">⌕</button>
      <input id="address-search-input" class="websig-address-input" type="search" autocomplete="off" placeholder="Rechercher une adresse…" aria-label="Rechercher une adresse">
      <button id="address-search-clear" class="websig-address-clear" type="button" aria-label="Effacer">×</button>
    </div>
    <div id="address-search-results" class="websig-address-results"></div>
  </div>
  <div id="address-destination-card" class="websig-destination-card">
    <div><strong id="address-destination-label"></strong><small id="address-destination-source"></small></div>
    <a id="address-route-button" class="websig-route-btn" href="#" target="_blank" rel="noopener" title="Partir à cette adresse" aria-label="Partir à cette adresse">➜</a>
  </div>
</div>
{% endblock %}
{% block scripts %}
{{ block.super }}
<script src="{% static 'portal/js/address_search_map.js' %}"></script>
{% endblock %}
