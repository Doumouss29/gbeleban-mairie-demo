{% extends 'portal/map.html' %}{% load static %}
{% block head %}
{{ block.super }}
<style>
.websig-address-search{position:fixed;z-index:999;left:50%;top:150px;transform:translateX(-50%);width:min(720px,calc(100vw - 32px));pointer-events:none}.websig-address-search .search-shell{pointer-events:auto;background:#fff;border:1px solid #d9ded9;border-radius:16px;box-shadow:0 8px 28px #0003;padding:10px}.websig-address-row{display:grid;grid-template-columns:1fr auto;gap:8px}.websig-address-input{width:100%;border:1px solid #ccd4cf;border-radius:11px;padding:12px 14px;font-size:15px;outline:none}.websig-address-input:focus{border-color:#ef7d00;box-shadow:0 0 0 3px #ef7d0022}.websig-address-btn{border:0;border-radius:11px;background:#ef7d00;color:#fff;font-weight:800;padding:0 18px;cursor:pointer}.websig-address-results{display:none;margin-top:8px;max-height:340px;overflow:auto;border-top:1px solid #ecefec}.websig-address-results.open{display:block}.websig-address-item{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;padding:10px 8px;border-bottom:1px solid #eef0ee;cursor:pointer}.websig-address-item:hover{background:#f8faf8}.websig-address-source{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:#f1f4f2}.websig-address-item b{display:block;color:#173d2f;font-size:13px}.websig-address-item small{display:block;color:#6b756f;font-size:11px;margin-top:2px}.websig-address-badge{font-size:10px;font-weight:850;border-radius:999px;padding:5px 8px;background:#eef5f0;color:#056b3c}.websig-address-badge.google{background:#f2f2f2;color:#3c4043}.websig-address-status{font-size:11px;color:#68736d;padding:8px}.websig-destination-card{display:none;pointer-events:auto;margin-top:8px;background:#fff;border:1px solid #d9ded9;border-radius:14px;box-shadow:0 8px 28px #0003;padding:12px 14px}.websig-destination-card.open{display:flex;align-items:center;justify-content:space-between;gap:12px}.websig-destination-card strong{display:block;color:#173d2f;font-size:14px}.websig-destination-card small{color:#6b756f}.websig-route-btn{white-space:nowrap;text-decoration:none;background:#056b3c;color:#fff;border-radius:10px;padding:10px 13px;font-weight:800;font-size:12px}.websig-search-marker{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#ef3b2d;border:3px solid #fff;box-shadow:0 3px 13px #0005;position:relative}.websig-search-marker:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;left:9px;top:9px}
@media(max-width:1100px){.websig-address-search{top:116px;width:min(620px,calc(100vw - 20px))}}@media(max-width:600px){.websig-address-search{top:100px}.websig-address-row{grid-template-columns:1fr}.websig-address-btn{padding:10px}.websig-address-item{grid-template-columns:30px 1fr}.websig-address-badge{display:none}.websig-destination-card.open{align-items:flex-start;flex-direction:column}.websig-route-btn{width:100%;text-align:center}}
</style>
{% endblock %}
{% block content %}
{{ block.super }}
<div id="address-search-overlay" class="websig-address-search" aria-label="Recherche d'adresse">
  <div class="search-shell">
    <div class="websig-address-row">
      <input id="address-search-input" class="websig-address-input" type="search" autocomplete="off" placeholder="Rechercher une adresse à Gbéléban ou une adresse Google..." aria-label="Rechercher une adresse">
      <button id="address-search-button" class="websig-address-btn" type="button">Rechercher</button>
    </div>
    <div id="address-search-results" class="websig-address-results"></div>
  </div>
  <div id="address-destination-card" class="websig-destination-card">
    <div><strong id="address-destination-label"></strong><small id="address-destination-source"></small></div>
    <a id="address-route-button" class="websig-route-btn" href="#" target="_blank" rel="noopener">Partir à cette adresse</a>
  </div>
</div>
{% endblock %}
{% block scripts %}
{{ block.super }}
<script src="{% static 'portal/js/address_search_map.js' %}"></script>
{% endblock %}
